# ─────────────────────────────────────────────────────────────────────────────
#  Version catalog.
#
#  Everything below is a *stable* release. Two entries deserve a note because
#  they are the whole reason this project exists:
#
#    tvMaterial → androidx.tv:tv-material  ("Compose for TV")
#        This is the modern replacement for the Leanback support library
#        (androidx.leanback:leanback). Leanback was formally deprecated by
#        Google; Compose for TV went 1.0.0 stable and is now the recommended
#        way to build Android TV UI. NOTE: there is *no* tv-foundation here on
#        purpose — androidx.tv:tv-foundation is frozen/deprecated. Its
#        TvLazyRow / TvLazyColumn were folded back into the ordinary
#        androidx.compose.foundation lazy lists, which now handle TV focus
#        correctly. Using plain LazyRow / LazyVerticalGrid is the current,
#        supported answer.
#
#    media3 → androidx.media3:*
#        ExoPlayer's current home. The standalone com.google.android.exoplayer2
#        artifacts are end-of-life; androidx.media3.exoplayer.ExoPlayer is the
#        same player under a new package.
# ─────────────────────────────────────────────────────────────────────────────
[versions]
agp = "8.13.0"
kotlin = "2.2.20"

coreKtx = "1.17.0"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
composeBom = "2025.10.00"
navigation = "2.9.6"

tvMaterial = "1.1.0"
media3 = "1.10.1"
coil = "3.3.0"
koin = "4.1.1"

junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
coroutinesTest = "1.10.2"

[libraries]
# ── AndroidX core / lifecycle ────────────────────────────────────────────────
androidx-core-ktx              = { module = "androidx.core:core-ktx",                         version.ref = "coreKtx" }
androidx-activity-compose      = { module = "androidx.activity:activity-compose",             version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }

# ── Compose ──────────────────────────────────────────────────────────────────
androidx-compose-bom            = { module = "androidx.compose:compose-bom",                  version.ref = "composeBom" }
androidx-compose-ui             = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics    = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling     = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation     = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-navigation-compose     = { module = "androidx.navigation:navigation-compose",        version.ref = "navigation" }

# ── Compose for TV (replaces Leanback) ───────────────────────────────────────
androidx-tv-material            = { module = "androidx.tv:tv-material",                       version.ref = "tvMaterial" }

# ── Media3 / ExoPlayer ───────────────────────────────────────────────────────
androidx-media3-exoplayer       = { module = "androidx.media3:media3-exoplayer",              version.ref = "media3" }
androidx-media3-exoplayer-hls   = { module = "androidx.media3:media3-exoplayer-hls",          version.ref = "media3" }
androidx-media3-exoplayer-dash  = { module = "androidx.media3:media3-exoplayer-dash",         version.ref = "media3" }
androidx-media3-ui-compose      = { module = "androidx.media3:media3-ui-compose",             version.ref = "media3" }
androidx-media3-common          = { module = "androidx.media3:media3-common",                 version.ref = "media3" }

# ── Images / DI ──────────────────────────────────────────────────────────────
coil-compose                    = { module = "io.coil-kt.coil3:coil-compose",                 version.ref = "coil" }
coil-network-okhttp             = { module = "io.coil-kt.coil3:coil-network-okhttp",          version.ref = "coil" }
koin-android                    = { module = "io.insert-koin:koin-android",                   version.ref = "koin" }
koin-androidx-compose           = { module = "io.insert-koin:koin-androidx-compose",          version.ref = "koin" }

# ── Test ─────────────────────────────────────────────────────────────────────
junit                           = { module = "junit:junit",                                   version.ref = "junit" }
kotlinx-coroutines-test         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-test-junit             = { module = "androidx.test.ext:junit",                       version.ref = "androidxJunit" }
androidx-espresso-core          = { module = "androidx.test.espresso:espresso-core",          version.ref = "espresso" }

[plugins]
android-application  = { id = "com.android.application",             version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
